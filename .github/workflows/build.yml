name: Build & Release Salón Suite

on:
  push:
    branches:
      - main
      - master
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin prefijo v (ej. 0.2.0)"
        required: true
        default: "0.2.0"
      channel:
        description: "Canal de actualización"
        type: choice
        options:
          - stable
          - beta
        default: stable
      license_server:
        description: "Servidor de licencias embebido (Vercel)"
        required: false
        default: "https://salon-license.vercel.app"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION_RAW: ${{ github.event.inputs.version || github.ref_name }}
  UPDATE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
  LICENSE_SERVER_URL: ${{ github.event.inputs.license_server || vars.LICENSE_SERVER_URL || 'https://salon-license.vercel.app' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Normalizar versión
        id: version
        run: |
          $version = "$env:APP_VERSION_RAW".Trim()
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            if ($env:GITHUB_REF_TYPE -eq "tag") {
              throw "Versión inválida en el tag: $version"
            }
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versión de compilación: $version"

      - name: Instalar dependencias de la app
        run: npm ci

      - name: Instalar dependencias del servidor de licencias
        working-directory: tools/license-server
        run: npm ci

      - name: Pruebas Fase 3 y Fase 4
        run: |
          npm run test:license
          npm run test:update
          npm run test:update-ui
          npm run test:update-helper

      - name: Compilar instalador firmado
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGNTOOL_TIMESTAMP_URL: ${{ vars.SIGNTOOL_TIMESTAMP_URL }}
          LICENSE_PUBLIC_KEY_PEM: ${{ vars.LICENSE_PUBLIC_KEY_PEM }}
        run: |
          $params = @{
            Version = $env:APP_VERSION
            LicenseServer = $env:LICENSE_SERVER_URL
            UpdateChannel = $env:UPDATE_CHANNEL
          }
          if ($env:LICENSE_PUBLIC_KEY_PEM) {
            $publicKey = Join-Path $env:RUNNER_TEMP "public_key.pem"
            [IO.File]::WriteAllText($publicKey, $env:LICENSE_PUBLIC_KEY_PEM.Trim() + "`n", [Text.UTF8Encoding]::new($false))
            $params.PublicKey = $publicKey
          }
          & build\build-installer.ps1 @params

      - name: Resumen de firma y hashes
        run: |
          $info = Get-Content dist\BUILD-INFO.json -Raw | ConvertFrom-Json
          if ($info.signed) {
            "Firma Authenticode: verificada" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Firma Authenticode: no configurada; se publican SHA-256 y aviso de SmartScreen." >> $env:GITHUB_STEP_SUMMARY
          }
          Get-Content dist\SHA256SUMS.txt | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY

      - name: Preparar licencia de humo
        if: vars.CI_SMOKE != 'false'
        env:
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
          LICENSE_ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
          SMOKE_LICENSE_KEY: ${{ secrets.SMOKE_LICENSE_KEY }}
        run: |
          if (-not $env:SMOKE_LICENSE_KEY) {
            Write-Host "SMOKE_LICENSE_KEY no configurada: el smoke se ejecutará sin activación."
            exit 0
          }
          if (-not $env:LICENSE_SERVER_URL -or -not $env:LICENSE_ADMIN_TOKEN) {
            throw "Faltan LICENSE_SERVER_URL o LICENSE_ADMIN_TOKEN para preparar la licencia de humo."
          }
          $base = $env:LICENSE_SERVER_URL.TrimEnd('/')
          $headers = @{ Authorization = "Bearer $env:LICENSE_ADMIN_TOKEN" }
          $license = Invoke-RestMethod -Uri "$base/admin/licenses/$env:SMOKE_LICENSE_KEY" -Headers $headers -TimeoutSec 30
          foreach ($activation in @($license.activations | Where-Object { -not $_.revoked })) {
            Invoke-RestMethod -Uri "$base/admin/licenses/$env:SMOKE_LICENSE_KEY/revoke" -Method Post -Headers $headers -TimeoutSec 30 | Out-Null
          }
          Write-Host "licencia de humo preparada"

      - name: Prueba de humo del instalador
        if: vars.CI_SMOKE != 'false'
        env:
          SMOKE_LICENSE_KEY: ${{ secrets.SMOKE_LICENSE_KEY }}
          SMOKE_LICENSE_EMAIL: ${{ secrets.SMOKE_LICENSE_EMAIL }}
        run: |
          $params = @{
            Installer = "dist\SalonSuite-$env:APP_VERSION-setup.exe"
            ExpectedVersion = $env:APP_VERSION
          }
          if ($env:SMOKE_LICENSE_KEY) {
            $params.ActivationKey = $env:SMOKE_LICENSE_KEY
            if ($env:SMOKE_LICENSE_EMAIL) { $params.ActivationEmail = $env:SMOKE_LICENSE_EMAIL }
          }
          & .\tests\ci-smoke.ps1 @params

      - name: Validar requisitos de entrega estable
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          LICENSE_ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
          SMOKE_LICENSE_KEY: ${{ secrets.SMOKE_LICENSE_KEY }}
          LICENSE_PUBLIC_KEY_PEM: ${{ vars.LICENSE_PUBLIC_KEY_PEM }}
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
          CI_SMOKE: ${{ vars.CI_SMOKE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          $info = Get-Content dist\BUILD-INFO.json -Raw | ConvertFrom-Json
          if (-not $info.signed) {
            throw "Un tag estable requiere un build con firma Authenticode verificada."
          }
          if (-not $env:LICENSE_SERVER_URL) {
            throw "Un tag estable requiere LICENSE_SERVER_URL explicita."
          }
          if (-not $env:LICENSE_PUBLIC_KEY_PEM) {
            throw "Un tag estable requiere LICENSE_PUBLIC_KEY_PEM para embeber la llave publica."
          }
          if (-not $env:SMOKE_LICENSE_KEY) {
            throw "Un tag estable requiere SMOKE_LICENSE_KEY para probar la activacion real."
          }
          if (-not $env:LICENSE_ADMIN_TOKEN) {
            throw "Un tag estable requiere LICENSE_ADMIN_TOKEN para publicar el manifiesto."
          }
          if (-not $env:VERCEL_TOKEN) {
            throw "Un tag estable requiere VERCEL_TOKEN para desplegar el servidor."
          }
          if ("$env:CI_SMOKE" -eq "false") {
            throw "Un tag estable no puede desactivar la prueba de humo."
          }
          Write-Host "requisitos de entrega estable: OK"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: salonsuite-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/SalonSuite-${{ steps.version.outputs.version }}-setup.exe
            dist/SalonSuite-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json

      - name: Desplegar servidor de licencias en Vercel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if (-not $env:VERCEL_TOKEN) {
            Write-Host "VERCEL_TOKEN no configurado: se omite el despliegue del servidor."
            exit 0
          }
          npx --yes vercel@latest link --yes --project salon-license --team gabinotrejos-projects --cwd tools/license-server --token $env:VERCEL_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vercel link falló" }
          npx --yes vercel@latest deploy --prod --yes --cwd tools/license-server --token $env:VERCEL_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vercel deploy falló" }

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SalonSuite-${{ steps.version.outputs.version }}-setup.exe
            dist/SalonSuite-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publicar actualización en Vercel
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
          LICENSE_ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
        run: |
          if (-not $env:LICENSE_SERVER_URL) { throw "Falta LICENSE_SERVER_URL" }
          if (-not $env:LICENSE_ADMIN_TOKEN) { throw "Falta LICENSE_ADMIN_TOKEN" }

          $setup = "dist\SalonSuite-$env:APP_VERSION-setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower()
          $channel = if ("$env:APP_VERSION" -match '-') { "beta" } else { "$env:UPDATE_CHANNEL" }
          $base = $env:LICENSE_SERVER_URL.TrimEnd('/')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SalonSuite-$env:APP_VERSION-setup.exe"
          $body = [ordered]@{
            channel = $channel
            version = $env:APP_VERSION
            url = $url
            sha256 = $hash
            notes = "Versión $env:APP_VERSION"
            published_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json -Depth 4

          $headers = @{ Authorization = "Bearer $env:LICENSE_ADMIN_TOKEN" }
          $result = Invoke-RestMethod -Uri "$base/admin/updates" -Method Post -Headers $headers -ContentType "application/json" -Body $body -TimeoutSec 60
          if (-not $result.ok) { throw "No se pudo publicar el manifiesto" }
          Write-Host "manifiesto $channel publicado para $env:APP_VERSION"

      - name: Verificar servidor de licencias
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          LICENSE_PUBLIC_KEY_PEM: ${{ vars.LICENSE_PUBLIC_KEY_PEM }}
        run: |
          $base = $env:LICENSE_SERVER_URL.TrimEnd('/')
          $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 30
          if (-not $health.ok) { throw "El servidor de licencias no reporta ok en /health" }
          $public = Invoke-RestMethod -Uri "$base/public" -TimeoutSec 30
          if (-not $public.ok -or -not $public.public_key) { throw "El servidor de licencias no publica su llave en /public" }
          if ($public.public_key.Trim() -ne $env:LICENSE_PUBLIC_KEY_PEM.Trim()) {
            throw "La llave publica del servidor no coincide con LICENSE_PUBLIC_KEY_PEM."
          }
          $manifest = Invoke-RestMethod -Uri "$base/api/version?channel=$env:UPDATE_CHANNEL" -TimeoutSec 30
          if (-not $manifest.ok -or [string]$manifest.version -ne $env:APP_VERSION -or -not $manifest.sha256 -or -not $manifest.signature) {
            throw "El manifiesto remoto no corresponde a la version estable o no esta firmado."
          }
          Write-Host "servidor de licencias y manifiesto: OK"
