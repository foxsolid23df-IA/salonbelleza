name: salonsuite-license

services:
  license:
    build: .
    image: salonsuite-license:2.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      LICENSE_DATA_DIR: /data
      LICENSE_TRUST_PROXY: "1"
      LICENSE_UPDATES_DIR: /updates
    volumes:
      - license-data:/data
      - ./updates:/updates:ro
    expose:
      - "4000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      license:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-get.salonsuite.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  license-data:
  caddy-data:
  caddy-config:
